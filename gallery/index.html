<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comically Large Gallery</title>
  <link rel="stylesheet" href="https://use.typekit.net/loy8wwx.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="corner-logo" aria-hidden="true">
    <img class="logo-bubble" src="../assets/Artboard 2 3.png" alt="">
    <img class="logo-wordmark" src="../assets/GALLERY.png" alt="">
  </div>
  <img class="corner-mic" src="../assets/micassetsAsset 6 1.png" alt="" aria-hidden="true">

  <main class="gallery-stage">
    <div id="galleryTrack" class="gallery-track" aria-live="polite"></div>

    <div id="galleryStatus" class="gallery-status">
      Loading drawings&hellip;
    </div>
  </main>

  <footer class="gallery-footer">
    <span id="galleryCount">0 drawings</span>
  </footer>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="../env/config.js"></script>
  <script src="../env/supabase-client.js"></script>
  <script src="gallery.js"></script>
</body>
</html>
