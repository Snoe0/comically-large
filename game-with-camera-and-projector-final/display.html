<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comically Large — Display</title>
  <link rel="stylesheet" href="https://use.typekit.net/loy8wwx.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="display">
  <!-- Play-phase stage: promptpage.png fills the viewport; prompt text sits
       inside the box region of the artwork; the timer is positioned over the
       image just below the box. Hidden outside the play phase via CSS. -->
  <div class="play-stage">
    <div class="play-stage-page">
      <div id="promptLabel" class="prompt-label"></div>
      <div class="timer-display">1:30</div>
    </div>
  </div>

  <!-- Prompt select overlay -->
  <div id="promptOverlay" class="prompt-overlay">
    <div class="comic-panel">
      <h1 class="prompt-title">YOUR PROMPT IS...</h1>
      <div id="promptScroller" class="prompt-scroller">
        <div id="promptScrollerTrack" class="prompt-scroller-track"></div>
        <div class="scroller-highlight"></div>
      </div>
    </div>
  </div>

  <!-- Pencils-ready intro overlay (shown 1.5s before countdown) -->
  <div id="readyOverlay" class="ready-overlay hidden">
    <img src="../assets/Main - Prompt.png" alt="Players, get your pencils ready!" />
  </div>

  <!-- Countdown video overlay -->
  <div id="countdownOverlay" class="countdown-overlay hidden">
    <video id="countdownVideo" src="../assets/comic-countdown.mp4" playsinline preload="auto" muted></video>
  </div>

  <!-- Final framed caption overlay (shown at end) -->
  <div id="captionOverlay" class="caption-overlay hidden">
    <div class="frame-wrap">
      <img class="frame-img" id="frameImg" src="../assets/pictureframesAsset 1 1.png" alt="frame" />
      <canvas id="finalDrawingCanvas" class="frame-drawing"></canvas>
    </div>
    <div class="plaque">
      <div id="captionText" class="caption-text"></div>
    </div>
  </div>

  <script src="sync.js"></script>
  <script src="display.js"></script>
</body>
</html>
